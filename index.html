<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palacio de Memoria 3D</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #0b0b12; font-family: system-ui, sans-serif; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #ui { position: fixed; top: 12px; left: 12px; color: #e6e6f0; background: rgba(20,20,32,0.75); padding: 10px 14px; border-radius: 10px; backdrop-filter: blur(6px); font-size: 13px; z-index: 10; max-width: 260px; }
      #ui button { margin-left: 8px; padding: 4px 10px; border: 1px solid #555; background: #1e1e2e; color: #e6e6f0; border-radius: 6px; cursor: pointer; }
      #ui button:hover { background: #2a2a40; }
      #ui input[type="text"] { width: 120px; padding: 4px 6px; border: 1px solid #555; background: #1e1e2e; color: #e6e6f0; border-radius: 6px; }
      #ui ul { list-style: none; padding: 0; margin: 8px 0 0 0; max-height: 200px; overflow-y: auto; }
      #hint { position: fixed; bottom: 12px; left: 12px; color: #aaa; font-size: 12px; z-index: 10; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui">
      Modo: <span id="modeLabel">Abstracto</span>
      <button id="toggleMode">Cambiar modo</button>
      <button id="tourBtn">Recorrido</button>
      <div style="margin-top:8px;display:flex;gap:4px;align-items:center;">
        <input id="newName" type="text" placeholder="Nuevo recuerdo" />
        <input id="newColor" type="color" value="#ff9933" />
        <button id="addBtn">+</button>
      </div>
      <ul id="memoryList"></ul>
    </div>
    <div id="hint">Click + arrastrar para rotar · Rueda para zoom · Click en esferas para recordar</div>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
